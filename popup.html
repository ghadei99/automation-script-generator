<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Test Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Browser Test Recorder</h1>
      <p id="targetLabel">Looking for a browser tab…</p>
    </div>
    <div id="statusPill" class="pill idle">Idle</div>
  </header>
  <div class="layout">
    <nav id="nav">
      <button type="button" data-view="recorder" class="active">Recorder</button>
      <button type="button" data-view="steps">Test steps</button>
      <button type="button" data-view="run">Run tests</button>
      <button type="button" data-view="results">Results</button>
      <button type="button" data-view="export">Code export</button>
      <button type="button" data-view="ai">AI assistant</button>
      <button type="button" data-view="settings">Settings</button>
    </nav>
    <main id="main"></main>
  </div>
  <footer id="errorBar" hidden></footer>
  <script src="lib/id.js"></script>
  <script src="lib/origin.js"></script>
  <script src="lib/redact.js"></script>
  <script src="lib/schema.js"></script>
  <script src="lib/ai.js"></script>
  <script src="codegen.js"></script>
  <script src="popup.js"></script>
</body>
</html>
